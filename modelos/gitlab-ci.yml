# Push na {{HML_BRANCH}} publica em homologação; push na {{PROD_BRANCH}}, em produção.
# Gerado pelo zero-downtime-deploy (modelos/gitlab-ci.yml). Inclua os testes do sistema no job test.
stages: [test, deploy]

# Sem pipeline duplicado: com merge request aberto, um push numa branch comum roda só o
# pipeline do merge request. As branches de deploy rodam sempre, senão o deploy não sairia.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "{{PROD_BRANCH}}" || $CI_COMMIT_BRANCH == "{{HML_BRANCH}}"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  # Runner compartilhado do GitLab
  image: {{TESTE_IMAGEM}}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "{{PROD_BRANCH}}" || $CI_COMMIT_BRANCH == "{{HML_BRANCH}}"
  script:
    # {{TESTE_SCRIPT}}

.deploy:
  stage: deploy
  # Runner da VM (executor shell), registrado com esta tag
  tags: [{{TAG_RUNNER}}]
  script:
    - cd "/opt/{{SISTEMA}}/$ENV_NAME"
    - git fetch origin
    - git reset --hard "origin/$CI_COMMIT_BRANCH"
    - bash deploy.sh "$ENV_NAME"

# Um job por ambiente: o resource_group fixo garante um deploy por vez em cada um.
# GIT_STRATEGY none: não clona, atualiza a pasta do ambiente em /opt.
deploy_{{HML_NOME}}:
  extends: .deploy
  resource_group: {{HML_NOME}}
  variables: { ENV_NAME: "{{HML_NOME}}", GIT_STRATEGY: none }
  rules:
    - if: $CI_COMMIT_BRANCH == "{{HML_BRANCH}}"

deploy_{{PROD_NOME}}:
  extends: .deploy
  resource_group: {{PROD_NOME}}
  variables: { ENV_NAME: "{{PROD_NOME}}", GIT_STRATEGY: none }
  rules:
    - if: $CI_COMMIT_BRANCH == "{{PROD_BRANCH}}"
