# {{COM_HML}}
# Push na {{HML_BRANCH}} publica em homologação; push na {{PROD_BRANCH}}, em produção.
# {{SEM_HML}}
# Push na {{PROD_BRANCH}} publica em produção (sem homologação).
# {{FIM}}
# Gerado pelo zero-downtime-deploy (modelos/github-deploy.yml). Inclua os testes do sistema no job test.
name: Deploy

on:
  push:
    branches: [{{BRANCHES}}]
  pull_request:
    branches: [{{BRANCHES}}]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # {{TESTE_PASSOS}}

  deploy:
    needs: test
    # Pull request não executa nada na VM
    if: github.event_name == 'push'
    # Runner instalado na VM pelo setup-host.sh, com a label do sistema
    runs-on: [self-hosted, {{SISTEMA}}]
    timeout-minutes: 30
    # {{COM_HML}}
    # Um grupo por branch: um push na {{HML_BRANCH}} não cancela um deploy da {{PROD_BRANCH}} na fila
    # {{FIM}}
    concurrency: deploy-${{ github.ref_name }}
    env:
      # {{COM_HML}}
      ENV_NAME: ${{ github.ref_name == '{{PROD_BRANCH}}' && '{{PROD_NOME}}' || '{{HML_NOME}}' }}
      # {{SEM_HML}}
      ENV_NAME: {{PROD_NOME}}
      # {{FIM}}
    steps:
      - name: Deploy
        working-directory: /opt/{{SISTEMA}}/${{ env.ENV_NAME }}
        run: |
          git fetch origin
          git reset --hard "origin/${GITHUB_REF_NAME}"
          bash deploy.sh "$ENV_NAME"
