# Cor {{COR}}. O deploy.sh define o projeto e o APP_PREFIX de cada ambiente.
# Gerado pelo zero-downtime-deploy (modelos/compose.cor.yml).
name: {{SISTEMA}}-{{COR}}

services:
  # Nome genérico de propósito: o nome do serviço vira alias na rede web, compartilhada por
  # todos os ambientes e sistemas. O Nginx acha cada cor pelo container_name, que é exclusivo.
  app:
    build: .
    image: {{SISTEMA}}:${APP_PREFIX:-}{{COR}}
    container_name: ${APP_PREFIX:-}{{COR}}_app
    restart: unless-stopped
    env_file: .env
    # Banco no próprio servidor: use host.docker.internal no endereço do banco
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Dono de ./uploads no host (id -u, id -g); o setup-host.sh grava APP_UID e APP_GID no .env
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    volumes:
      - ./uploads:/app/uploads
    # Nunca publique portas aqui: só o Nginx expõe portas, senão as duas cores não sobem juntas
    networks: [web]
    healthcheck:
      # Tenta wget (Alpine), curl e node, para servir a imagens diferentes. Deixe só o que a sua tiver.
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:{{PORTA_APP}}{{HEALTH}} >/dev/null 2>&1
          || curl -fsS http://127.0.0.1:{{PORTA_APP}}{{HEALTH}} >/dev/null 2>&1
          || node -e "fetch('http://127.0.0.1:{{PORTA_APP}}{{HEALTH}}').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

networks:
  web:
    external: true
