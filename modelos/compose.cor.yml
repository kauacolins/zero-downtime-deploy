# Cor {{COR}}. O deploy.sh define o projeto e o APP_PREFIX de cada ambiente.
# Gerado pelo zero-downtime-deploy (modelos/compose.cor.yml).
name: {{SISTEMA}}-{{COR}}

services:
  # Um serviço por aplicação (monorepo: front e API trocam de cor juntos). Com uma só, o nome é
  # app, genérico de propósito: o nome do serviço vira alias na rede web, compartilhada por todos
  # os ambientes e sistemas. O Nginx acha cada cor pelo container_name, que é exclusivo.
  # {{SERVICOS}}

networks:
  web:
    external: true
