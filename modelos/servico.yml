# Fragmento de um serviço do compose de cada cor: o scaffold.sh o repete por aplicação.
  {{SERVICO}}:
    build:
      context: {{CONTEXTO}}
      # {{BUILD_ARGS}}
    image: {{SISTEMA}}:${APP_PREFIX:-}{{COR}}{{SUFIXO_IMAGEM}}
    container_name: ${APP_PREFIX:-}{{COR}}_{{SERVICO}}
    restart: unless-stopped
    env_file: .env
    # {{AMBIENTE}}
    # Banco no próprio servidor: use host.docker.internal no endereço do banco
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Dono das pastas montadas no host (id -u, id -g); o setup-host.sh grava APP_UID e APP_GID no .env
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    # {{VOLUMES}}
    # Nunca publique portas aqui: só o Nginx expõe portas, senão as duas cores não sobem juntas
    networks: [web]
    healthcheck:
      # Tenta wget (Alpine), curl, node, python3 e php, para servir a imagens diferentes
      # (python:slim e php não têm wget nem curl). Deixe só o que a sua tiver.
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:{{PORTA_SERVICO}}{{HEALTH_SERVICO}} >/dev/null 2>&1
          || curl -fsS http://127.0.0.1:{{PORTA_SERVICO}}{{HEALTH_SERVICO}} >/dev/null 2>&1
          || node -e "fetch('http://127.0.0.1:{{PORTA_SERVICO}}{{HEALTH_SERVICO}}').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null
          || python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{PORTA_SERVICO}}{{HEALTH_SERVICO}}', timeout=3)" >/dev/null 2>&1
          || php -r "exit(@file_get_contents('http://127.0.0.1:{{PORTA_SERVICO}}{{HEALTH_SERVICO}}') === false ? 1 : 0);" 2>/dev/null
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
