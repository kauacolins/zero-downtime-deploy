# Na porta 80, o domínio pedido escolhe o ambiente; a porta {{PORTA_HML}} é só de homologação.
# A cor ativa de cada ambiente fica em /etc/nginx/active/<ambiente>.inc, gerado pelo deploy.sh.
# Gerado pelo zero-downtime-deploy (modelos/nginx/default.conf).

# DNS do Docker. Com o destino em variável, o nome é resolvido a cada requisição:
# um ambiente parado responde 502 só no seu domínio e não impede o Nginx de subir ou recarregar.
resolver 127.0.0.11 valid=5s ipv6=off;

# Mantém o protocolo informado por um proxy na frente (ex.: Cloudflare)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Recusa acesso por IP ou por domínio desconhecido
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Produção
server {
    listen 80;
    server_name {{DOMINIO_PROD}}{{IP_PROD}};

    set $app_upstream {{SISTEMA}}_blue_app:{{PORTA_APP}};
    # O curinga evita erro enquanto o ambiente ainda não teve deploy
    include /etc/nginx/active/{{PROD_NOME}}*.inc;
    include /etc/nginx/conf.d/proxy.inc;
}

# Homologação: na porta {{PORTA_HML}}, com qualquer domínio ou IP
server {
    listen {{PORTA_HML}} default_server;
    # {{HML_PORTA_80}}

    set $app_upstream {{SISTEMA}}_hml_blue_app:{{PORTA_APP}};
    include /etc/nginx/active/{{HML_NOME}}*.inc;
    include /etc/nginx/conf.d/proxy.inc;
}
