name: Deploy

on:
  push:
    branches: [main]

concurrency: deploy

jobs:
  deploy:
    # Runner instalado na VM, com o usuário do deploy
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Deploy
        working-directory: /var/www/app
        run: |
          git pull --ff-only origin main
          bash deploy.sh
