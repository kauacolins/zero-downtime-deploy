name: app-green

services:
  green_app:
    build: .
    image: app:green
    container_name: green_app
    restart: unless-stopped
    env_file: .env
    environment:
      AUTH_TRUST_HOST: "true"
    # Banco no próprio servidor: use host.docker.internal na DATABASE_URL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Dono de ./uploads no host (id -u, id -g)
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    volumes:
      - ./uploads:/app/uploads
    networks: [web]
    healthcheck:
      # A imagem não tem curl
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  web:
    external: true
