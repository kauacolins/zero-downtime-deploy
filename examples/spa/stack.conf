# Stack: lida pelo scaffold.sh, não é copiada para o repositório do sistema.
DESCRICAO="Front-end com build estático (Vite, Create React App, Vue CLI, Angular): servido por Nginx"
# Alternativas com |: basta uma
DETECTA='package.json:"vite"|package.json:"react-scripts"|package.json:"@vue/cli-service"|package.json:"@angular/core"'
# Nginx sem root dentro do contêiner: porta 8080
APP_PORT=8080
HEALTH=/
# Prefixos das variáveis gravadas no build (Vite, Create React App, Vue CLI)
BUILD_ARGS_PREFIXO="VITE_ REACT_APP_ VUE_APP_"
# Arquivos estáticos: nada é gravado pela aplicação
VOLUMES_PADRAO=
